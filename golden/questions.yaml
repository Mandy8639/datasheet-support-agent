# Golden evaluation set. Written by hand from the datasheets; every item is verified by
# scripts/build_golden.py against the PDF page text AND Arduino's markdown original.
# Values and quotes: Arduino S.r.l. datasheets, CC BY-SA 4.0 (see data/sources.toml).
#
# answer types:
#   number  {value, unit, bound: min|typ|max|value}
#   range   {min, max, unit}
#   text    {must_include: [...]}           case-insensitive, all must appear
#   choice  {sku} or {tie: true, value, unit}
#   refuse  {reason: not_in_datasheet | tbc | out_of_corpus}
# forbidden: strings that must never appear in the answer (injection checks).
# gold[].evidence: an exact quote (whitespace/case-insensitive) from the datasheet.
# gold[].numbers: which numbers must appear near that quote (comparisons only).

